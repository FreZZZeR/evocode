[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evocode"
version = "0.1.1"
description = "Read, decode, sign and write BMW NBT EVO (QNX) coding over ENET/HSFZ — pure stdlib."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Igor Titov" }]
keywords = ["bmw", "nbt-evo", "coding", "hsfz", "uds", "enet", "idrive", "qnx"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Operating System :: OS Independent",
]
dependencies = []  # core is stdlib-only, on purpose

[project.optional-dependencies]
crypto = ["cryptography>=41"]   # only for `recover-key` (PKCS#12/AES/RSA over your own PSdZData)
test = ["pytest>=7"]            # `tests/` run under pytest (core tests also self-run: python tests/test_coding.py)

[project.urls]
Homepage = "https://github.com/FreZZZeR/evocode"
Source = "https://github.com/FreZZZeR/evocode"

[project.scripts]
evocode = "evocode.cli:main"

[tool.setuptools]
packages = ["evocode"]
